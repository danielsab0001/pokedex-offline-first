name: pokedex
description: "Pokédex móvil Offline-First con Flutter y GraphQL (PokeAPI)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.0 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  graphql: ^5.2.4
  connectivity_plus: ^7.3.2
  go_router: ^17.5.0
  cached_network_image: ^3.4.1
  intl: any
  http: ^1.6.0
  flutter_cache_manager: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true